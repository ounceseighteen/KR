{% extends 'admin/base.html' %}
{% block title %}Добавить сеанс — Админ{% endblock %}

{% block content %}
<div class="admin-header">
    <h1 class="page-title">Добавить сеанс</h1>
    <a href="{{ url_for('admin_sessions') }}" class="btn btn--outline">← Назад</a>
</div>

<div class="form-card">
    <form method="post">
        <div class="form-group">
            <label>Фильм</label>
            <select name="film_id" required>
                {% for film in films %}
                <option value="{{ film.id }}">{{ film.title }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Зал</label>
            <select name="hall_id" required>
                {% for hall in halls %}
                <option value="{{ hall.id }}">{{ hall.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Дата</label>
                <input type="date" name="date" required>
            </div>
            <div class="form-group">
                <label>Время</label>
                <input type="time" name="time" required>
            </div>
            <div class="form-group">
                <label>Цена (₽)</label>
                <input type="number" name="price" min="0" step="50" required value="400">
            </div>
        </div>
        <button type="submit" class="btn btn--primary">Создать сеанс</button>
    </form>
</div>
{% endblock %}
