{% extends 'base.html' %}
{% block title %}Регистрация — КиноМакс{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1 class="auth-card__title">Регистрация</h1>
        <form method="post">
            <div class="form-group">
                <label>Имя</label>
                <input type="text" name="name" required placeholder="Иван Иванов">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="your@email.ru">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required placeholder="Не менее 6 символов" minlength="6">
            </div>
            <button type="submit" class="btn btn--primary btn--full">Создать аккаунт</button>
        </form>
        <p class="auth-card__footer">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
    </div>
</div>
{% endblock %}
